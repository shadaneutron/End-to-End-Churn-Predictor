<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChurnGuard AI | Customer Retention Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #020617);
            color: #f8fafc;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #2dd4bf;
            outline: none;
            box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.2);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
        }

        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2dd4bf;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-12 flex justify-between items-center fade-in">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-teal-400 to-blue-500 bg-clip-text text-transparent">
                    ChurnGuard AI
                </h1>
                <p class="text-slate-400 text-sm mt-1">Telecom Intelligence & Predictive Analytics</p>
            </div>
            <div class="hidden md:block">
                <span
                    class="px-3 py-1 rounded-full bg-teal-500/10 border border-teal-500/20 text-teal-400 text-xs font-medium">
                    PRO VERSION 2.1
                </span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Left Column: Form -->
            <div class="lg:col-span-5 glass rounded-3xl p-8 fade-in" style="animation-delay: 0.1s;">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    Customer Profile
                </h2>
                <form id="churnForm" class="space-y-5">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Tenure
                            (Months)</label>
                        <input type="number" name="tenure" required min="0" max="100" value="1"
                            class="w-full px-4 py-3 rounded-xl input-glass text-slate-200">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label
                                class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Monthly
                                Charges</label>
                            <input type="number" step="0.01" name="MonthlyCharges" required value="45.00"
                                class="w-full px-4 py-3 rounded-xl input-glass text-slate-200">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Total
                                Charges</label>
                            <input type="number" step="0.01" name="TotalCharges" required value="45.00"
                                class="w-full px-4 py-3 rounded-xl input-glass text-slate-200">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Contract
                            Type</label>
                        <select name="Contract"
                            class="w-full px-4 py-3 rounded-xl input-glass text-slate-200 appearance-none">
                            <option value="Month-to-month">Month-to-month</option>
                            <option value="One year">One year</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Internet
                            Service</label>
                        <select name="InternetService"
                            class="w-full px-4 py-3 rounded-xl input-glass text-slate-200 appearance-none">
                            <option value="Fiber optic">Fiber optic</option>
                            <option value="DSL">DSL</option>
                            <option value="No">No Service</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Payment
                            Method</label>
                        <select name="PaymentMethod"
                            class="w-full px-4 py-3 rounded-xl input-glass text-slate-200 appearance-none">
                            <option value="Electronic check">Electronic check</option>
                            <option value="Mailed check">Mailed check</option>
                            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                            <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full py-4 rounded-xl btn-gradient font-bold text-white flex justify-center items-center gap-2 mt-4">
                        <span>Analyze Risk</span>
                        <div id="loader" class="loader"></div>
                    </button>
                </form>
            </div>

            <!-- Right Column: Visualization -->
            <div class="lg:col-span-7 glass rounded-3xl p-8 flex flex-col items-center justify-center fade-in"
                style="animation-delay: 0.2s;">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold mb-2">Churn Risk Probability</h2>
                    <p class="text-slate-400 text-sm">AI-driven estimation based on behavior patterns</p>
                </div>

                <div class="relative w-full max-w-sm">
                    <canvas id="gaugeChart"></canvas>
                    <div id="probValue" class="absolute inset-0 flex flex-col items-center justify-center pt-16">
                        <span class="text-5xl font-black text-slate-200">0%</span>
                        <span id="riskLabel"
                            class="text-xs font-bold uppercase tracking-widest text-slate-500 mt-2">WAITING...</span>
                    </div>
                </div>

                <div class="mt-12 grid grid-cols-3 gap-6 w-full text-center">
                    <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                        <p class="text-slate-500 text-[10px] uppercase font-bold mb-1">Status</p>
                        <p id="statusBadge" class="text-teal-400 font-bold text-sm">Ready</p>
                    </div>
                    <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                        <p class="text-slate-500 text-[10px] uppercase font-bold mb-1">Latency</p>
                        <p id="latencyBadge" class="text-slate-300 font-bold text-sm">-- ms</p>
                    </div>
                    <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                        <p class="text-slate-500 text-[10px] uppercase font-bold mb-1">Confidence</p>
                        <p class="text-slate-300 font-bold text-sm">94.2%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Initialize the Risk Gauge Chart using Chart.js
         * Visualizes the churn probability as a semi-doughnut.
         */
        const ctx = document.getElementById('gaugeChart').getContext('2d');
        const gaugeChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [0, 100],
                    backgroundColor: ['#2dd4bf', '#1e293b'],
                    borderWidth: 0,
                    circumference: 180,
                    rotation: 270,
                    cutout: '85%',
                    borderRadius: 20
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                }
            }
        });

        // DOM Element Selectors
        const form = document.getElementById('churnForm');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const probValueText = document.getElementById('probValue').querySelector('span');
        const riskLabel = document.getElementById('riskLabel');
        const statusBadge = document.getElementById('statusBadge');
        const latencyBadge = document.getElementById('latencyBadge');

        /**
         * Handle Form Submission
         * Intercepts submit event, sends data to API, and triggers UI updates.
         */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Toggle loading states
            submitBtn.disabled = true;
            loader.style.display = 'block';
            submitBtn.querySelector('span').textContent = 'Processing...';

            const startTime = performance.now();
            const formData = new FormData(form);
            
            // Map form data to API schema
            const payload = {
                tenure: parseInt(formData.get('tenure')),
                MonthlyCharges: parseFloat(formData.get('MonthlyCharges')),
                TotalCharges: parseFloat(formData.get('TotalCharges')),
                Contract: formData.get('Contract'),
                InternetService: formData.get('InternetService'),
                PaymentMethod: formData.get('PaymentMethod')
            };

            try {
                // Post to the local prediction endpoint
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Server response was not OK");

                const data = await response.json();
                const prob = data.churn_probability;
                const endTime = performance.now();

                // Update metrics and visual chart
                latencyBadge.textContent = `${Math.round(endTime - startTime)}ms`;
                statusBadge.textContent = 'Analyzed';
                updateUI(prob);

            } catch (error) {
                console.error('Prediction failed:', error);
                statusBadge.textContent = 'Error';
                statusBadge.className = 'text-red-400 font-bold text-sm';
            } finally {
                // Restore button state
                submitBtn.disabled = false;
                loader.style.display = 'none';
                submitBtn.querySelector('span').textContent = 'Analyze Risk';
            }
        });

        /**
         * Update UI and Animate Gauge
         * @param {number} prob - The churn probability percentage (0-100)
         */
        function updateUI(prob) {
            // Animate probability number from current to target
            let currentVal = parseFloat(probValueText.textContent) || 0;
            const targetVal = prob;
            const duration = 1000;
            const start = performance.now();

            function animate(time) {
                let timeFraction = (time - start) / duration;
                if (timeFraction > 1) timeFraction = 1;

                let val = currentVal + (targetVal - currentVal) * timeFraction;
                probValueText.textContent = val.toFixed(1) + '%';

                if (timeFraction < 1) requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            // Dynamically determine color and risk label based on thresholds
            let color = '#2dd4bf'; // Teal (Low Risk)
            let risk = 'Low Risk';

            if (prob > 70) {
                color = '#ef4444'; // Red (High Risk)
                risk = 'High Risk';
                riskLabel.className = 'text-xs font-bold uppercase tracking-widest text-red-500 mt-2';
                probValueText.className = 'text-5xl font-black text-red-400';
            } else if (prob > 40) {
                color = '#f59e0b'; // Orange (Medium Risk)
                risk = 'Medium Risk';
                riskLabel.className = 'text-xs font-bold uppercase tracking-widest text-amber-500 mt-2';
                probValueText.className = 'text-5xl font-black text-amber-400';
            } else {
                riskLabel.className = 'text-xs font-bold uppercase tracking-widest text-teal-500 mt-2';
                probValueText.className = 'text-5xl font-black text-teal-400';
            }

            riskLabel.textContent = risk;

            // Trigger Chart.js animation update
            gaugeChart.data.datasets[0].data = [prob, 100 - prob];
            gaugeChart.data.datasets[0].backgroundColor = [color, '#1e293b'];
            gaugeChart.update();
        }
    </script>
</body>

</html>
